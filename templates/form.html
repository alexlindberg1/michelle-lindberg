<input type="hidden" name="csrf" value="{{ csrf }}">
<div class="fields">
  <p>
    <label for="company">Company</label>
    <input id="company" name="company" value="{{ item.company }}" required autocomplete="organization">
  </p>
  <p>
    <label for="role">Role</label>
    <input id="role" name="role" value="{{ item.role }}" autocomplete="organization-title">
  </p>
  <p>
    <label for="website">Company website</label>
    <input id="website" name="website" type="text" inputmode="url" value="{{ item.website }}" placeholder="https://">
  </p>
  <p>
    <label for="posting_url">Application link</label>
    <input id="posting_url" name="posting_url" type="text" inputmode="url" value="{{ item.posting_url }}" placeholder="https://">
  </p>
  <p>
    <label for="location">Location</label>
    <input id="location" name="location" value="{{ item.location }}">
  </p>
  <p>
    <label for="pay">Estimated pay</label>
    <input id="pay" name="pay" value="{{ item.pay }}" placeholder="$25/hr or $7k/mo">
  </p>
  <p>
    <label for="status">Status</label>
    <select id="status" name="status" required>
      {% for status in statuses %}
      <option value="{{ status }}" {% if item.status == status %}selected{% endif %}>{{ status }}</option>
      {% endfor %}
    </select>
  </p>
  <p>
    <label for="applied_on">Applied on</label>
    <input id="applied_on" name="applied_on" type="date" value="{{ item.applied_on }}">
  </p>
  <p>
    <label for="deadline">Deadline</label>
    <input id="deadline" name="deadline" type="date" value="{{ item.deadline }}">
  </p>
  <p>
    <label for="contact">Contact</label>
    <input id="contact" name="contact" value="{{ item.contact }}">
  </p>
  <p class="wide">
    <label for="notes">Notes</label>
    <textarea id="notes" name="notes" rows="4">{{ item.notes }}</textarea>
  </p>
</div>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
